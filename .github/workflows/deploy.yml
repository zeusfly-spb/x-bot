name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    needs: []
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "$HOME/x-bot"
            git fetch origin
            git reset --hard origin/master || git reset --hard origin/main
            . .venv/bin/activate
            pip install -r requirements.txt
            sudo -n systemctl restart grok-bot.service
            sudo -n systemctl --no-pager --full status grok-bot.service
